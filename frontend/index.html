<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 修复原因：无 favicon 导致每次加载 console 报 favicon.ico 404 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- 主题首帧防闪：localStorage 记忆为 dark 时提前挂类（main.js 同一 key） -->
  <script>if (localStorage.getItem('rc-theme') === 'dark') document.documentElement.classList.add('dark')</script>
  <title>Resume Copilot · 简历-JD 匹配助手</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
